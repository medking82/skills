name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  notice:
    if: github.repository == 'medking82/skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quiet: ${{ steps.check.outputs.quiet }}
    steps:
      - name: Check today's failure notice
        id: check
        uses: medking82/skills/.github/actions/upstream-sync-notice@main
        with:
          mode: check

  sync:
    needs: notice
    # A failed notice job must not skip the sync; it then reports normally.
    if: ${{ !cancelled() && github.repository == 'medking82/skills' && github.ref == 'refs/heads/main' }}
    # After the day's first failure email, a scheduled retry that fails again stays green.
    continue-on-error: ${{ needs.notice.outputs.quiet == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the fork
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate sync behavior and current skill metadata
        run: python -B -m unittest discover -s tests

      - name: Prepare and validate the upstream merge
        id: prepare
        run: python -B scripts/sync-upstream.py

      - name: Check out the pinned qualification runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: medking82/hermes-fleet-sync
          ref: 4f79a5b4452d9a91037e4cbf564a927b44e2bac6
          path: .qualification-runner
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Qualify the exact prepared commit
        if: steps.prepare.outputs.changed == 'true'
        run: python -B scripts/qualify-release.py --runner .qualification-runner --state "$RUNNER_TEMP/release-qualification"

      - name: Publish the verified merge
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          git push origin HEAD:refs/heads/main

  mark:
    needs: [notice, sync]
    if: ${{ !cancelled() && needs.sync.result == 'failure' && needs.notice.outputs.quiet != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remember today's failure notice
        uses: medking82/skills/.github/actions/upstream-sync-notice@main
        with:
          mode: mark
